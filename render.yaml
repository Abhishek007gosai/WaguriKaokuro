services:
  - type: web
    plan: free
    name: auto-rename-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: DB_URL
        sync: false
      - key: DB_NAME
        sync: false
      - key: WEBHOOK
        value: "True"
      - key: LOG_CHANNEL
        sync: false
      - key: SUPPORT_CHAT
        sync: false
      - key: DUMP_CHANNEL
        sync: false
      - key: START_PIC
        sync: false
      - key: ADMIN_URL
        sync: false
